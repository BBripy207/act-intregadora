version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    command: [ "npm", "start" ]
  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    command: [ "npm", "start" ]
    environment:
      - REACT_APP_BACKEND_URL=http://backend:3000
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
